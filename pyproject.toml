[project]
name = "orderbook-matching"
version = "0.1.0"
description = "A low-latency order book matching engine with trading bots and spoofing surveillance."
readme = "README.md"
requires-python = ">=3.12"
# The engine itself must stay dependency-free. Add runtime deps only for sim, surveillance, or gateway.
dependencies = []

[dependency-groups]
dev = [
    "hdrhistogram>=0.10.8",
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "sortedcontainers>=2.4.0",
]
analysis = [
    "numpy>=2.5.4",
    "polars>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obm"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PERF", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "bench"]
strict = true
warn_unreachable = true

# sortedcontainers ships no type hints. It is used only by the baseline in bench/.
[[tool.mypy.overrides]]
module = ["sortedcontainers"]
ignore_missing_imports = true
